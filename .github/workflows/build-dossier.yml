name: Build dossier PDF
on:
  push:
    branches: [main]
    paths:
      - "dossier/**"
      - ".github/workflows/build-dossier.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: dossier
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: dossier-via-bufalini
          path: dossier/main.pdf
          if-no-files-found: error
